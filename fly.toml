# fly.toml app configuration file generated for yasuo-gem on 2026-03-23T13:44:42Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'yasuo-gem'
primary_region = 'sin'

[build]

[[mounts]]
  source = 'data'
  destination = '/app/data'

[http_service]
  internal_port = 7860
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
